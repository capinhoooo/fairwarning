name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  near-contract:
    name: NEAR contract (fmt, clippy, sandbox tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/near
    steps:
      - uses: actions/checkout@v4
      # rustup >= 1.28 no longer installs the rust-toolchain.toml channel on first use
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/near
      - name: Install cargo-near 0.22.0
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - run: cargo fmt --all --check
      - run: cargo clippy -p fair-warning --target wasm32-unknown-unknown -- -D warnings
      - name: Build wasm
        run: for c in mock-signer mock-ft contract; do (cd $c && cargo near build non-reproducible-wasm --no-abi --locked); done
      - name: Sandbox tests
        working-directory: contracts/near/sandbox-tests
        run: cargo test --locked -- --test-threads=4

  base-contracts:
    name: Base contracts (forge test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/base
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts@v5.7.0 OpenZeppelin/openzeppelin-contracts-upgradeable@v5.7.0 --no-git
      - run: forge fmt --check
      - run: forge test -vv

  backend:
    name: Backend (typecheck, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fw_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fw_test
      # throwaway values for tests; nothing here touches a network with a key
      JWT_SECRET: ci-test
      BASE_RPC_URL: https://mainnet.base.org
      FW_CONTRACT_ID: fw.test.near
      WATCHER_ACCOUNT_ID: w.test.near
      WATCHER_PRIVATE_KEY: ed25519:3D4YudUahN1nawWogh8pAKSj92sUNMdbZGjn7kERKzYoTy8tnFQuwoGUC51DowKqorvkr2pytJSnwuSbsNVfqygr
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx prisma db push --config prisma/prisma.config.ts
      - run: bunx prisma generate --config prisma/prisma.config.ts
      - run: bunx tsc --noEmit
      - run: bun test

  payload-hash:
    name: MPC payload hash vs mainnet vector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # check_mainnet_vector.ts imports the backend's encoder, whose viem resolves from backend/node_modules
      - run: bun install --frozen-lockfile
        working-directory: backend
      - run: bun run check

  web:
    name: Web (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
