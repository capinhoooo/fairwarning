[package]
name = "fair-warning"
version = "0.1.0"
edition = "2021"

description = "Fair Warning: a notice-or-pay bond on NEAR for admin actions on Base, verified by NEAR MPC"
license = "MIT"

# cargo near build reproducible-wasm: builds the committed source in this image (tag is descriptive, digest is binding).
# It also needs `repository` set to the public repo URL and a clean, pushed git tree.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.29.1", features = ["unstable"] }
near-contract-standards = "=5.29.1"
# tag 3.17.0, same rev the Omni Bridge MPC prover pins
near-mpc-sdk = { git = "https://github.com/near/mpc", rev = "d0fc87b19e2643299e7becdd7d9611afcd5d5a78" }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing", "unstable"] }

